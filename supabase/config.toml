# Supabase CLI project config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "cysejrutcrfvopqjqknv"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://gisenyi-gadgets.vercel.app"
additional_redirect_urls = ["https://gisenyi-gadgets.vercel.app", "http://localhost:3000", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[functions.initiate-payment]
verify_jwt = false

[functions.check-payment-status]
verify_jwt = false

[functions.payment-callback]
verify_jwt = false
